name: Daily puzzles & deploy

on:
  schedule:
    - cron: '5 0 * * *' # 00:05 UTC, just after the UTC date rolls over
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # commit generated puzzles back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate puzzles
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: npm run generate

      # Pushes made with GITHUB_TOKEN don't trigger workflows, so this can't loop.
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data data
          if ! git diff --cached --quiet; then
            git commit -m "chore: puzzle data for $(date -u +%F)"
            git push
          fi

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
